<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#102c43"><title>Hermont Parts Daily</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#142a3a;background:#f2f5f8}*{box-sizing:border-box}body{margin:0;padding-bottom:95px}header{background:#102c43;color:white;padding:22px 17px 16px}header h1{font-size:23px;margin:0}header small{color:#b8cbd9}main{max-width:850px;margin:auto;padding:14px}nav{display:flex;gap:5px;overflow:auto;padding:8px 0;position:sticky;top:0;background:#f2f5f8;z-index:2}button,select,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #cbd7df;background:white;border-radius:10px;padding:10px 12px;color:#17374a}nav button.active,.primary{background:#145b76;color:white;border-color:#145b76}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:white;border-radius:12px;padding:12px;flex:1;min-width:80px}.stat strong{display:block;font-size:23px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.toolbar input,.toolbar select{padding:10px;border:1px solid #cad4dd;border-radius:10px;min-width:0;flex:1}.group{margin:20px 0 9px;color:#425a6a}.card{background:white;border:1px solid #e1e7ed;border-radius:14px;padding:14px;margin:9px 0;box-shadow:0 1px 3px #0001}.head{display:flex;justify-content:space-between;gap:8px;align-items:center}.unit{font-size:20px;font-weight:800}.muted{color:#657989;font-size:13px}.issue{font-weight:650;margin:10px 0}.chips{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}.chip{background:#e8eff4;border-radius:6px;padding:5px 7px;font-size:12px}.signals{display:flex;gap:7px}.signal{width:35px;height:32px;padding:0;border:2px solid transparent;opacity:.5}.signal.selected{border-color:#152b3a;opacity:1;box-shadow:0 0 0 2px #fff inset}.red{background:#e65d5d}.yellow{background:#eac34e}.green{background:#49ba7c}.card textarea{width:100%;min-height:65px;border:1px solid #d5dfe6;border-radius:8px;padding:9px;margin-top:10px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.checks{display:flex;gap:13px;flex-wrap:wrap;font-size:13px;margin:9px 0}.routine{display:block;padding:13px;background:white;border-radius:10px;margin:8px 0}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;justify-content:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:white;border-top:1px solid #d8e1e7;z-index:3}.bottom button{flex:1;max-width:240px;font-size:13px}details{background:white;border-radius:10px;padding:12px;margin:10px 0}textarea{resize:vertical}.warn{background:#fff4dc;padding:10px;border-radius:9px;font-size:13px}.hidden{display:none}</style></head><body><header><h1>HERMONT <span style="color:#74dbc7">PARTS</span></h1><small>Daily workboard · Independent offline-capable file</small></header><main><div class="stats" id="stats"></div><nav id="tabs"><button data-tab="today" class="active">Today</button><button data-tab="parts">Parts</button><button data-tab="other">Other</button><button data-tab="routine">Routine</button></nav><div class="toolbar"><input id="search" type="search" placeholder="Search unit, RO, part, notes"><select id="dsp"><option value="">All DSPs</option></select></div><div id="content"></div></main><div class="bottom"><button onclick="backup()">Backup JSON</button><button onclick="document.getElementById('restore').click()">Restore JSON</button><button class="primary" onclick="addJob()">+ Add job</button></div><input id="restore" type="file" accept=".json,application/json" hidden><script>
const START={"date":"2026-11-19","vehicles":[],"tasks":[],"routine":[{"id":"routine0","text":"Review current board by DSP","done":false},{"id":"routine1","text":"Check outstanding orders and ETAs","done":false},{"id":"routine2","text":"Verify parts physically received","done":false},{"id":"routine3","text":"Call vendors grouped by supplier","done":false},{"id":"routine4","text":"Confirm technician parts handoffs","done":false},{"id":"routine5","text":"Confirm completions with Devon","done":false},{"id":"routine6","text":"Update workboard before 8 AM","done":false},{"id":"routine7","text":"Export lunch / end-of-day backup","done":false}],"history":{},"dailyNotes":"","specialNotes":[],"schemaVersion":4,"exportedAt":"2026-11-18T19:06:20.369Z"};
const KEY='hermont-parts-independent-v1';
let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(START)}catch(e){state=JSON.parse(JSON.stringify(START))}
let tab='today',query='',dsp='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Storage unavailable. Export a JSON backup to preserve changes.')}}
function statuses(v){return Array.isArray(v.boardStatuses)?v.boardStatuses:[]}
function closed(v){return statuses(v).includes('closed')}
function show(v){if(tab==='today')return !closed(v);if(tab==='parts')return statuses(v).includes('parts')||v.group==='parts';if(tab==='other')return true;return false}
function render(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let opts=[...new Set(state.vehicles.map(v=>v.dsp||'Unassigned'))].sort();let ds=document.getElementById('dsp');ds.innerHTML='<option value="">All DSPs</option>'+opts.map(x=>`<option value="${esc(x)}" ${x===dsp?'selected':''}>${esc(x)}</option>`).join('');let active=state.vehicles.filter(v=>!closed(v));document.getElementById('stats').innerHTML=`<div class="stat"><strong>${state.vehicles.length}</strong><span class="muted">All records</span></div><div class="stat"><strong>${active.length}</strong><span class="muted">Not closed</span></div><div class="stat"><strong>${state.vehicles.filter(closed).length}</strong><span class="muted">Closed</span></div><div class="stat"><strong>${active.filter(v=>v.partsSignal==='red'||v.partsSignal==='yellow').length}</strong><span class="muted">Need attention</span></div>`;
if(tab==='routine'){document.getElementById('content').innerHTML='<h3>Routine tasks</h3>'+state.routine.map((r,i)=>`<label class="routine"><input type="checkbox" ${r.done?'checked':''} onchange="routineCheck(${i},this.checked)"> ${esc(r.text)}</label>`).join('')+'<h3>Daily notes</h3><textarea id="daily" style="width:100%;min-height:120px" oninput="state.dailyNotes=this.value;save()">'+esc(state.dailyNotes)+'</textarea>';return}
let matches=state.vehicles.map((v,i)=>({...v,_i:i})).filter(v=>show(v)&&(!dsp||(v.dsp||'Unassigned')===dsp)&&[v.unit,v.ro,v.issue,v.note,v.dsp].join(' ').toLowerCase().includes(query));let groups=[...new Set(matches.map(v=>v.dsp||'Unassigned'))].sort();document.getElementById('content').innerHTML=(tab==='other'?'<p class="muted">All records, including closed jobs. Completion statuses are preserved.</p>':'')+(matches.length?'':'<p>No matching jobs.</p>')+groups.map(g=>`<h3 class="group">${esc(g)} (${matches.filter(v=>(v.dsp||'Unassigned')===g).length})</h3>`+matches.filter(v=>(v.dsp||'Unassigned')===g).map(v=>card(v)).join('')).join('')}
function card(v){let i=v._i;return `<article class="card"><div class="head"><div><span class="unit">${esc(v.unit)}</span> <span class="muted">RO ${esc(v.ro||'Unconfirmed')}</span></div><span class="chip">${esc(statuses(v).join(', ')||v.group||'Unassigned')}</span></div><div class="issue">${esc(v.issue)}</div><div class="chips">${statuses(v).map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div><div class="signals">${['red','yellow','green'].map(s=>`<button aria-label="${s} status" title="${s} status" class="signal ${s} ${v.partsSignal===s?'selected':''}" onclick="signal(${i},'${s}')"></button>`).join('')}</div><div class="checks">${[0,1,2].map(j=>`<label><input type="checkbox" ${v.checks?.[j]?'checked':''} onchange="check(${i},${j},this.checked)"> Step ${j+1}</label>`).join('')}</div><textarea aria-label="Job notes" placeholder="Notes, ETA, supplier, next step" oninput="note(${i},this.value)">${esc(v.note)}</textarea><div class="actions"><button onclick="edit(${i})">Edit</button><button onclick="changeStatus(${i})">Board status</button><button onclick="changeDSP(${i})">DSP</button></div></article>`}
function signal(i,s){state.vehicles[i].partsSignal=state.vehicles[i].partsSignal===s?null:s;save();render()}
function check(i,j,b){state.vehicles[i].checks??=[false,false,false];state.vehicles[i].checks[j]=b;save();render()}
function note(i,s){state.vehicles[i].note=s;save()}
function routineCheck(i,b){state.routine[i].done=b;save();render()}
function edit(i){let v=state.vehicles[i];for(let [key,label] of [['unit','Unit'],['ro','RO'],['issue','Work needed']]){let a=prompt(label,v[key]||'');if(a===null)return;v[key]=a}save();render()}
function changeDSP(i){let v=state.vehicles[i],a=prompt('DSP / company',v.dsp||'Unassigned');if(a===null)return;v.dsp=a.trim()||'Unassigned';save();render()}
function changeStatus(i){let v=state.vehicles[i],a=prompt('Board statuses, comma-separated: diag, parts, dealer, workready, denied, closed',statuses(v).join(', '));if(a===null)return;v.boardStatuses=a.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);save();render()}
function addJob(){let unit=prompt('Unit number');if(!unit)return;let ro=prompt('Repair order number')||'',issue=prompt('Work needed')||'',company=prompt('DSP / company')||'Unassigned';state.vehicles.push({id:'manual_'+Date.now(),unit,ro,issue,dsp:company,boardStatuses:['diag'],checks:[false,false,false],note:'',partsSignal:null});save();tab='today';render()}
function backup(){let content=JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),blob=new Blob([content],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Hermont_Daily_'+new Date().toISOString().replace(/[:.]/g,'-')+'_Backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.getElementById('restore').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.vehicles)||!Array.isArray(x.routine))throw Error('Invalid Hermont backup');if(confirm(`Restore ${x.vehicles.length} records? This replaces the current local data. Export a backup first if needed.`)){state=x;save();render()}}catch(err){alert('Cannot restore: '+err.message)}e.target.value=''});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.getElementById('search').oninput=e=>{query=e.target.value.toLowerCase();render()};document.getElementById('dsp').onchange=e=>{dsp=e.target.value;render()};render();
</script></body></html>
